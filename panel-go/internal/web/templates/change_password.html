{{define "content"}}
<h3>🔑 Смена пароля</h3>
{{if .MustChange}}
<div class="alert alert-warning">⚠️ Требуется смена пароля по умолчанию (admin/admin).</div>
{{end}}
{{if .Error}}
<div class="alert alert-danger">{{.Error}}</div>
{{end}}
<form method="post" action="/change-password" class="form">
  <label>Текущий пароль:</label>
  <input type="password" name="old_password" class="input" required>
  <label>Новый пароль:</label>
  <input type="password" name="new_password" class="input" required>
  <label>Подтвердите пароль:</label>
  <input type="password" name="confirm_password" class="input" required>
  <button type="submit" class="btn btn-primary">Сменить пароль</button>
</form>
{{end}}
