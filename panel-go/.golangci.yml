# golangci-lint конфигурация (пункт 18 IMPROVEMENTS.md).
run:
  timeout: 3m
  go: "1.26"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gofmt
    - goimports

linters-settings:
  goimports:
    local-prefixes: paylater-mon
  misspell:
    locale: US

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
    - path: internal/web/templates\.go
      linters:
        - all
  max-issues-per-linter: 50
  max-same-issues: 10
